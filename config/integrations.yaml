integrations:
  hermes-orchestrator:
    role: orchestrator
    sync: bidirectional
    skills: ["github-sync", "paios-core", "web-content"]
    path: "C:\\Users\\chesr\\paios\\integrations\\hermes-orchestrator"
  Citadel:
    role: security
    sync: push-only
    skills: ["security-monitor", "threat-detection", "zero-trust"]
    path: "C:\\Users\\chesr\\paios\\integrations\\Citadel"
  AI-Ops-Vault:
    role: secrets
    sync: bidirectional
    skills: ["api-key-management", "credential-sync", "encrypted-configs"]
    path: "C:\\Users\\chesr\\paios\\integrations\\AI-Ops-Vault"
  evelyn-brain:
    role: backup
    sync: push-only
    skills: ["backup-workflows", "restore-points", "sync-system"]
    path: "C:\\Users\\chesr\\paios\\integrations\\evelyn-brain"
  PROMPT-GUIDE-AI:
    role: prompts
    sync: bidirectional
    skills: ["prompt-templates", "prompt-examples", "prompt-library"]
    path: "C:\\Users\\chesr\\paios\\integrations\\PROMPT-GUIDE-AI"

workflow_sync:
  enabled: true
  interval: "30m"
  targets: ["hermes-orchestrator", "Citadel", "evelyn-brain"]
  workflows_dir: "C:\\Users\\chesr\\paios\\workflows"

health_checks:
  enabled: true
  interval: "15m"
  checks: ["auth", "skills", "workflows", "api-keys", "repo-status"]

coach:
  role: skills-learning
  sync: bidirectional
  skills: ["youtube-content", "composio", "integration-orchestrator"]
  path: "C:\\Users\\chesr\\paios\\skills\\local\\paios-core\\coach"
  daemon: true
  interval_min: 30
  agents:
    - hermes-orchestrator
    - Citadel
    - AI-Ops-Vault
    - evelyn-brain
    - PROMPT-GUIDE-AI
    - github-sync
    - skill-ecosystem
    - integration-orchestrator
    - system-hardening
    - composio

fleetbase:
  role: logistics
  sync: bidirectional
  skills: ["fleetbase-logistics", "composio"]
  path: "C:\\Users\\chesr\\paios\\integrations\\fleetbase"
  repo: "https://github.com/fleetbase/fleetbase"

sync_priorities:
  critical: ["api-keys", "auth"]
  high: ["skills", "workflows"]
  medium: ["configs", "documentation"]
  low: ["logs", "cache"]